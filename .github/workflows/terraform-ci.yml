name: Terraform CI

on:
  push:
    branches:
      - "main"
    paths:
      - "projects/**"
      - "scripts/**"
      - ".github/workflows/terraform-ci.yml"
  pull_request:
    paths:
      - "projects/**"
      - "scripts/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ${{ matrix.lab }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lab:
          - 01-vpc-network
          - 02-secure-compute-engine
          - 03-terraform-backend
          - 04-monitoring-alerts
          - 05-cloud-run-app
          - 06-workload-identity-federation
    defaults:
      run:
        working-directory: projects/${{ matrix.lab }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Terraform (minimum supported version)
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.9.8"

      - name: Check formatting
        run: terraform fmt -check -recursive

      # -backend=false: static validation only, no cloud credentials or state access.
      - name: Initialize providers without a backend
        run: terraform init -backend=false -lockfile=readonly -input=false

      - name: Validate configuration
        run: terraform validate -no-color

  security-scan:
    name: Security scan (Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Install Checkov
        run: pip install --disable-pip-version-check checkov==3.4.6

      # Accepted risks are documented inline with #checkov:skip comments next to each resource.
      - name: Scan Terraform labs
        run: >-
          checkov
          --directory projects
          --skip-path archive
          --framework terraform
          --compact
          --quiet
          --skip-download

  app-test:
    name: Test Cloud Run app (Lab 05)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: projects/05-cloud-run-app/app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run node --test
        run: |
          node --version
          npm test

  shellcheck:
    name: ShellCheck (scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: shellcheck
        run: shellcheck scripts/*.sh
